<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Chủ - Tiện Ích & Get Key</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: radial-gradient(circle at top, #1b2838, #0a0f1d 65%);
    }
    .card {
      width: 100%;
      max-width: 480px;
      padding: 32px 24px;
      text-align: center;
      background: rgba(20, 30, 55, .94);
      border: 1px solid #34466e;
      border-radius: 22px;
      box-shadow: 0 20px 60px #0008;
    }
    h1 { margin: 0 0 10px; font-size: 26px; }
    p { color: #b7c4df; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: #315efb;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #4770ff; }
    .btn-secondary { background: #223254; border: 1px solid #3d568c; }
    .btn-secondary:hover { background: #2c3f6a; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🚀 TRANG CHỦ DỰ ÁN</h1>
    <p>Chào mừng bạn đến với hệ thống của tôi. Chọn chức năng bên dưới để tiếp tục:</p>

    <!-- Nút chuyển sang trang get key (Thay link bên dưới bằng link GitHub Pages chứa trang lấy key của bạn) -->
    <a href="https://<tên-tài-khoản-github>.github.io/<tên-repo-lấy-key>/" class="btn">🔑 Lấy Key Tự Động</a>

    <!-- Bạn có thể thêm các nút chức năng khác ở đây sau này -->
    <a href="#" class="btn btn-secondary">🛠️ Tính năng khác (Sắp ra mắt)</a>
  </main>
</body>
</html>
